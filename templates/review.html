{% extends "base.html" %}

{% block title %}Review Mode - QuizMaster X{% endblock %}

{% block content %}
    <h1>Review Mode</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% else %}
        <div id="question-container">
            <h2>{{ question.question_text }}</h2>
            <div>
                <button class="option-button" onclick="checkAnswer('a', '{{ question.correct_answer }}', {{ question.question_id }})">A: {{ question.option_a }}</button>
                <button class="option-button" onclick="checkAnswer('b', '{{ question.correct_answer }}', {{ question.question_id }})">B: {{ question.option_b }}</button>
                <button class="option-button" onclick="checkAnswer('c', '{{ question.correct_answer }}', {{ question.question_id }})">C: {{ question.option_c }}</button>
                <button class="option-button" onclick="checkAnswer('d', '{{ question.correct_answer }}', {{ question.question_id }})">D: {{ question.option_d }}</button>
                <button class="option-button" onclick="checkAnswer('e', '{{ question.correct_answer }}', {{ question.question_id }})">E: {{ question.option_e }}</button>
            </div>
            <div id="difficulty-selection" style="display:none;">
                <p>How difficult was this question?</p>
                <div>
                    <button onclick="submitReview('easy', {{ question.question_id }})">Easy</button>
                    <button onclick="submitReview('medium', {{ question.question_id }})">Medium</button>
                    <button onclick="submitReview('hard', {{ question.question_id }})">Hard</button>
                    <button onclick="submitReview('wrong', {{ question.question_id }})">I was wrong</button>
                </div>
            </div>
        </div>
    {% endif %}
{% endblock %}

{% block extra_js %}
<script>
    let correctAnswerGlobal = '';

    function checkAnswer(selectedOption, correctAnswer, questionId) {
        correctAnswerGlobal = correctAnswer.toLowerCase();
        const options = document.querySelectorAll('.option-button');
        options.forEach(option => {
            option.disabled = true;
            option.onclick = null;
            const optionLetter = option.textContent.charAt(0).toLowerCase();
            if (optionLetter === correctAnswerGlobal) {
                option.classList.add('correct');
            }
            if (optionLetter === selectedOption && selectedOption !== correctAnswerGlobal) {
                option.classList.add('incorrect');
            }
        });
        document.getElementById('difficulty-selection').style.display = 'block';
    }

    function submitReview(difficulty, questionId) {
        fetch('/submit_review', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                question_id: questionId,
                difficulty: difficulty
            }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                setTimeout(() => {
                    window.location.href = '/review';
                }, 1000);
            } else {
                alert('Error submitting review.');
            }
        });
    }
</script>
{% endblock %}
